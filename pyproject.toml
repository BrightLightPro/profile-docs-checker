[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-docs-checker"
version = "1.5.0"
description = "Validate PDF and Word document metadata against Excel, show concise in-app results, and create corrected Word copies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.23",
  "openpyxl>=3.1",
  "python-docx>=1.1",
]
authors = [{ name = "Othman Thieyabat" }]

[project.scripts]
profile-docs-checker = "doc_table_checker.cli:main"
profile-docs-checker-gui = "doc_table_checker.gui:main"
# Backward-compatible command names from v1.0.x
doc-table-checker = "doc_table_checker.cli:main"
doc-table-checker-gui = "doc_table_checker.gui:main"

[tool.setuptools.packages.find]
include = ["doc_table_checker*"]

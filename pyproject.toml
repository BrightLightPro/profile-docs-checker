[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-docs-checker"
version = "1.2.0"
description = "Validate fixed-template PDF document identification tables and automatic standard Word change-notice tables or optional custom Word tables against an Excel master list."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.23",
  "openpyxl>=3.1",
  "python-docx>=1.1",
]
authors = [{ name = "Othman Thieyabat" }]

[project.scripts]
profile-docs-checker = "doc_table_checker.cli:main"
profile-docs-checker-gui = "doc_table_checker.gui:main"
profile-docs-checker-inspect-word = "doc_table_checker.word_inspector_cli:main"
# Backward-compatible command names from v1.0.x
doc-table-checker = "doc_table_checker.cli:main"
doc-table-checker-gui = "doc_table_checker.gui:main"
doc-table-checker-inspect-word = "doc_table_checker.word_inspector_cli:main"

[tool.setuptools.packages.find]
include = ["doc_table_checker*"]
